name: EarningsOS earnings event import

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2024-01-01"
        type: string
      end:
        description: "End date (YYYY-MM-DD)"
        required: true
        type: string
      symbols:
        description: "Comma-separated NIFTY 50 symbols"
        required: false
        default: "ADANIENT,ADANIPORTS,APOLLOHOSP,ASIANPAINT,AXISBANK,BAJAJ-AUTO,BAJAJFINSV,BAJFINANCE,BEL,BHARTIARTL,CIPLA,COALINDIA,DRREDDY,EICHERMOT,ETERNAL,GRASIM,HCLTECH,HDFCBANK,HDFCLIFE,HEROMOTOCO,HINDALCO,HINDUNILVR,ICICIBANK,INDUSINDBK,INFY,ITC,JIOFIN,JSWSTEEL,KOTAKBANK,LT,M&M,MARUTI,MAXHEALTH,NTPC,NESTLEIND,ONGC,POWERGRID,RELIANCE,SBILIFE,SHRIRAMFIN,SBIN,SUNPHARMA,TATACONSUM,TATAMOTORS,TATASTEEL,TCS,TECHM,TITAN,TRENT,ULTRACEMCO,WIPRO"
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL GitHub Actions secret is not configured"
            exit 1
          fi
      - name: Install API/database dependencies
        run: python -m pip install -r apps/api/requirements.txt pyarrow pandas requests
      - name: Download NSE earnings source
        run: |
          PYTHONPATH=. python scripts/download_nse_earnings_source.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --symbols "${{ inputs.symbols }}" \
            --output earnings_source.parquet
      - name: Upgrade database schema
        run: PYTHONPATH=. alembic -c alembic.ini upgrade head
      - name: Build and persist canonical earnings events
        run: |
          PYTHONPATH=. python scripts/build_earnings_events.py \
            --input earnings_source.parquet \
            --output-dir data/processed \
            --persist
      - name: Validate canonical event keys
        run: |
          python - <<'PY'
          import pandas as pd
          events = pd.read_parquet("data/processed/earnings_events.parquet")
          documents = pd.read_parquet("data/processed/earnings_documents.parquet")
          assert events["event_key"].is_unique
          assert documents["document_id"].is_unique
          print(f"events={len(events)} documents={len(documents)}")
          print(events[events["symbol"].eq("RELIANCE")].tail(10).to_string(index=False))
          print(events[events["symbol"].eq("ADANIENT")].tail(10).to_string(index=False))
          PY
