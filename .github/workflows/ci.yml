name: EarningsOS CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements.txt pytest pandas pyarrow
      - name: Run earnings and intelligence tests
        run: PYTHONPATH=.:apps/api pytest tests/test_earnings_events.py apps/api/test_intelligence.py -q
